name: Promote reviewed standalone release
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
concurrency:
  group: standalone-promotion
  cancel-in-progress: false
jobs:
  request:
    if: github.actor == 'coela-oss' && github.event.issue.pull_request && startsWith(github.event.comment.body, '/release ')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.request.outputs.tag }}
      revision: ${{ steps.request.outputs.revision }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: request
        env:
          RELEASE_REQUEST: ${{ github.event.comment.body }}
        run: node scripts/release-request.mjs
  build:
    needs: request
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
  publish:
    needs: [request, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.request.outputs.revision }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: native-*
          merge-multiple: true
          path: dist
      - name: Create or verify the immutable approved tag and publish verified assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.request.outputs.tag }}
          RELEASE_SOURCE_SHA: ${{ needs.request.outputs.revision }}
        run: |
          [[ "$RELEASE_SOURCE_SHA" == "$GITHUB_SHA" ]]
          error_file="$RUNNER_TEMP/tag-error"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" > "$RUNNER_TEMP/tag.json" 2> "$error_file"; then
            [[ "$(jq -r '.object.sha' "$RUNNER_TEMP/tag.json")" == "$RELEASE_SOURCE_SHA" ]]
          else
            grep -Fq 'HTTP 404' "$error_file"
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$RELEASE_SOURCE_SHA"
          fi
          git fetch origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          bash scripts/release.sh
