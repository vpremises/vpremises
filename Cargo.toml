[workspace]
members = [".", "crates/*"]
resolver = "2"

[package]
exclude = [
    "/registration/**",
    "/state/**",
    "/.local/**",
    "/.state/**",
    "/.data/**",
    "/secrets/**",
    "/credentials/**",
    "/.env",
    "/.env.production",
    "/.env.local",
    "/*.tgz",
    "/*.tar.gz",
    "/*.tar",
    "/*.zip",
    "/*.whl",
    "/*.crate",
    "/.ruff_cache/**",
    "/.mypy_cache/**",
    "/.tox/**",
    "/.nox/**",
    "/.hypothesis/**",
    "/.coverage",
    "/.coverage.*",
    "/htmlcov/**",
    "/lcov.info",
    "/junit.xml",
    "/*.profraw",
    "/*.profdata",
    "/*.egg-info/**",
    "/target/**",
    "/node_modules/**",
    "/dist/**",
    "/build/**",
    "/.cache/**",
    "/.pytest_cache/**",
    "/coverage/**",
]
name = "vpremises-security"
version = "0.1.1"
edition = "2021"
rust-version = "1.97"
license = "Apache-2.0"
description = "Local endpoint monitoring and security reporting tool"
readme = "README.md"
repository = "https://github.com/vpremises/vpremises-security"
keywords = ["security", "monitoring", "linux", "wsl"]
categories = ["command-line-utilities"]
publish = false

# Library target for programmatic local observation.
[lib]
name = "vpremises"

[[bin]]
name = "vpremises-security"
path = "src/main.rs"

[package.metadata.vpremises]
boundary = "metadata-observation-and-mounted-report-acquisition"
network_access = false
external_actions = false
follow_symlinks = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
