[package]
exclude = ["/registration/**", "/state/**", "/.local/**", "/.state/**", "/.data/**", "/secrets/**", "/credentials/**", "/.env", "/.env.production", "/.env.local", "/*.tgz", "/*.tar.gz", "/*.tar", "/*.zip", "/*.whl", "/*.crate", "/.ruff_cache/**", "/.mypy_cache/**", "/.tox/**", "/.nox/**", "/.hypothesis/**", "/.coverage", "/.coverage.*", "/htmlcov/**", "/lcov.info", "/junit.xml", "/*.profraw", "/*.profdata", "/*.egg-info/**", "/target/**", "/node_modules/**", "/dist/**", "/build/**", "/.cache/**", "/.pytest_cache/**", "/coverage/**"]
name = "crowsi-incident-coordinator"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "Deterministic incident coordination state machine for Crowsi"
license = "Apache-2.0"
readme = "README.md"
publish = false
autotests = false
repository = "https://github.com/vpremises/vpremises-security"

[package.metadata.crowsi]
external-actions = false
automatic-restore = false


[dependencies]
base64 = "0.22.1"
crowsi-control-contracts = { version = "=0.1.0" }
ed25519-dalek = "2.2.0"
getrandom = "0.2.17"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10.9"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"

[[test]]
name = "contracts"
path = "tests/harnesses/contracts.rs"

[[test]]
name = "recovery"
path = "tests/harnesses/recovery.rs"
